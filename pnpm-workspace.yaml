saveExact: true
strictPeerDependencies: true
strictDepBuilds: true
overrides:
  # Astro's TSX bridge supports both Emnapi major lines, but pnpm otherwise
  # selects the incompatible 2.0 beta for its 1.11 core. Remove this when the
  # bridge declares a single compatible runtime line.
  "@emnapi/runtime": 1.11.3
  "basic-ftp@<=6.2.0": 6.2.3
  "body-parser@<1.20.9": 1.20.9
  "http-cache-semantics@<=4.2.0": 4.3.0
  "sharp@<0.35.5": 0.35.5
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
  tmp: 0.2.7
  "undici@>=8.0.0 <8.12.2": 8.12.2
  "zod@>=4.0.0 <4.6.6": 4.6.7
audit:
  ignore:
    # No patched release exists. This is only reached by build-time linters
    # using repository-controlled glob patterns. Remove this exception when
    # braces publishes a patched release.
    - GHSA-vfj7-8cjw-p6xm
allowBuilds:
  esbuild: true
  workerd: true
