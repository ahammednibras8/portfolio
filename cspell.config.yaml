version: "0.2"
language: en-US
useGitignore: true

files:
  - "**/*.{astro,css,html,js,json,md,mjs,ts,tsx,yaml,yml}"

ignorePaths:
  - ".astro/**"
  - "coverage/**"
  - "dist/**"
  - "node_modules/**"
  - "playwright-report/**"
  - "pnpm-lock.yaml"
  - "test-results/**"

words:
  - Ahammed
  - ahammednibras
  - autorun
  - crawlable
  - esbuild
  - htmlvalidate
  - inspectable
  - lhci
  - lighthouseci
  - lighthouserc
  - lycheeverse
  - Nibras
  - Qwik
  - résumé
  - WCAG
  - workerd
