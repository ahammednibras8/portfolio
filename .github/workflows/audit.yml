name: Weekly audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-audit
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.PRODUCTION_URL }}
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}

jobs:
  audit:
    name: Cross-browser, links, dependencies, and production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          node-version-file: .node-version
          cache: true
          install: false

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "12.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build

      - name: Install Lychee 0.24.2
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --version
          checkbox: false
          fail: true
          failIfEmpty: false
          jobSummary: false
          lycheeVersion: v0.24.2
          output: .cache/lychee/setup.md

      - name: Check external links
        id: external-links
        run: >-
          pnpm run test:links
          --format markdown
          --output .cache/lychee/external.md

      - name: Install Firefox and WebKit
        run: pnpm exec playwright install --with-deps firefox webkit

      - name: Run Firefox and WebKit tests
        id: browser-tests
        run: pnpm exec playwright test tests/e2e tests/accessibility --project=firefox --project=webkit
        env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "true"

      - name: Smoke test production
        id: production-smoke
        if: env.PRODUCTION_URL != ''
        shell: bash
        run: |
          smoke_body="$RUNNER_TEMP/production-home.html"
          smoke_headers="$RUNNER_TEMP/production-headers.txt"

          curl --fail --silent --show-error --location --max-time 30 \
            --dump-header "$smoke_headers" \
            --output "$smoke_body" \
            "$PRODUCTION_URL"

          test -s "$smoke_body"
          grep -Eiq '^content-type:[[:space:]]*text/html' "$smoke_headers"

      - name: Report missing production URL
        if: env.PRODUCTION_URL == ''
        run: echo "::notice::Production smoke testing is dormant until the PRODUCTION_URL repository variable is configured."

      - name: Audit dependencies
        id: dependency-audit
        run: pnpm audit --audit-level high

      - name: Upload audit reports
        id: audit-reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: weekly-audit-reports
          path: |
            .cache/lychee/external.md
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify Discord of the weekly audit
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            printf 'Discord webhook is not configured.\n'
            exit 0
          fi

          payload="$(jq -nc '
            def status_text:
              {"success":"Passed","failure":"Failed","skipped":"Skipped","cancelled":"Cancelled","":"Skipped"}[.] // "Unknown";
            [
              "**Firefox and WebKit** · \(env.BROWSER_STATUS | status_text)",
              "**External links** · \(env.LINK_STATUS | status_text)",
              "**Production smoke test** · \(env.SMOKE_STATUS | status_text)",
              "**Dependencies** · \(env.DEPENDENCY_STATUS | status_text)"
            ]
            + (if env.AUDIT_REPORT_URL == "" then []
               else ["", "[Download audit archive](\(env.AUDIT_REPORT_URL))"] end)
            | {
                allowed_mentions: {parse: []},
                embeds: [{
                  title: "Weekly portfolio audit · \(env.AUDIT_STATUS | status_text)",
                  description: (join("\n"))
                }]
              }
          ')"
          if ! status="$(curl --silent --max-time 10 --output /dev/null \
            --write-out '%{http_code}' --json "$payload" --url-query 'wait=true' \
            --url "$DISCORD_WEBHOOK_URL")" || [[ "$status" != 200 ]]; then
            printf '::warning::Discord weekly audit notification failed.\n'
            exit 1
          fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AUDIT_STATUS: ${{ job.status }}
          BROWSER_STATUS: ${{ steps.browser-tests.outcome }}
          LINK_STATUS: ${{ steps.external-links.outcome }}
          SMOKE_STATUS: ${{ steps.production-smoke.outcome }}
          DEPENDENCY_STATUS: ${{ steps.dependency-audit.outcome }}
          AUDIT_REPORT_URL: ${{ steps.audit-reports.outputs.artifact-url }}

  publish-reports:
    name: Publish weekly reports
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ci-reports

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          node-version-file: .node-version
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download weekly audit reports
        uses: actions/download-artifact@v8.0.2
        with:
          name: weekly-audit-reports
          path: ${{ runner.temp }}/audit-reports

      - name: Prepare browser reports
        shell: bash
        run: |
          archive="$RUNNER_TEMP/audit-reports"
          publish="$RUNNER_TEMP/publish-audit"
          mkdir -p "$publish/external-links"
          python3 - "$archive/.cache/lychee/external.md" > "$publish/external-links/index.html" <<'PY'
          from html import escape
          from pathlib import Path
          import sys

          summary, _, _ = Path(sys.argv[1]).read_text(encoding="utf-8").partition("\n## ")
          rows = [line.strip("|").split("|") for line in summary.splitlines() if line.startswith("|")]
          if len(rows) < 3 or any(len(row) != 2 for row in rows):
              raise SystemExit("Could not read the Lychee status table.")

          print('<!doctype html><html lang="en"><head><meta charset="utf-8">')
          print('<meta name="viewport" content="width=device-width, initial-scale=1">')
          print('<title>Weekly external links</title></head><body><main>')
          print('<h1>Weekly external links</h1><table>')
          print('<thead><tr><th scope="col">Status</th><th scope="col">Count</th></tr></thead><tbody>')
          for status, count in rows[2:]:
              print(f'<tr><th scope="row">{escape(status.strip())}</th><td>{escape(count.strip())}</td></tr>')
          print('</tbody></table></main></body></html>')
          PY

          test -s "$archive/playwright-report/index.html"
          if [[ -d "$archive/playwright-report/data" ]]; then
            printf '::notice::The Playwright report has attachments and is available in the audit archive.\n'
          else
            mkdir -p "$publish/playwright"
            cp "$archive/playwright-report/index.html" "$publish/playwright/index.html"
          fi

      - name: Upload weekly reports to Cloudflare Pages
        id: deploy
        shell: bash
        run: |
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/audit-deploy.ndjson"
          pnpm exec wrangler pages deploy "$RUNNER_TEMP/publish-audit" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch weekly-audit \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false

          deployment_url="$(jq -ers --arg project "$CLOUDFLARE_PAGES_PROJECT" '
            map(select(.type == "pages-deploy-detailed" and .version == 1))
            | select(length == 1)
            | .[0]
            | select(.pages_project == $project and .environment == "preview")
            | .url
            | select(type == "string" and startswith("https://"))
          ' "$WRANGLER_OUTPUT_FILE_PATH")"
          printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

      - name: Verify report URLs
        shell: bash
        run: |
          for report in "$RUNNER_TEMP"/publish-audit/*/index.html; do
            route="$(basename "$(dirname "$report")")"
            url="$DEPLOYMENT_URL/$route/"
            curl --fail --silent --show-error --max-time 15 \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --dump-header "$RUNNER_TEMP/audit-report.headers" \
              --output "$RUNNER_TEMP/audit-report.html" "$url"

            cmp "$RUNNER_TEMP/audit-report.html" "$report"
            grep -Eiq '^content-type:[[:space:]]*text/html' "$RUNNER_TEMP/audit-report.headers"
            grep -Eiq '^x-robots-tag:[[:space:]]*noindex([[:space:]]|$)' "$RUNNER_TEMP/audit-report.headers"
          done

          {
            printf '## Weekly audit reports\n\n'
            printf -- '- [External links](%s/external-links/)\n' "$DEPLOYMENT_URL"
            if [[ -d "$RUNNER_TEMP/publish-audit/playwright" ]]; then
              printf -- '- [Playwright](%s/playwright/)\n' "$DEPLOYMENT_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
