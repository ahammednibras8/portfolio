name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.PRODUCTION_URL }}

jobs:
  verify:
    name: Verify production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .node-version
          cache: true
          install: false

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "12.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Lychee 0.24.2
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --version
          checkbox: false
          fail: true
          failIfEmpty: false
          jobSummary: false
          lycheeVersion: v0.24.2
          output: .cache/lychee/setup.md

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify production artifact
        run: pnpm run verify

      - name: Upload verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-reports-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            .lighthouseci/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload deployable site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .node-version
          cache: true
          install: false

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "12.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portfolio-dist-${{ github.sha }}
          path: dist/

      - name: Check verified artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_headers

      - name: Deploy verified artifact
        run: >-
          pnpm exec wrangler pages deploy dist
          --project-name "$CLOUDFLARE_PAGES_PROJECT"
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-dirty=false
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

      - name: Smoke test production
        run: |
          production_body="$RUNNER_TEMP/production-home.html"

          curl --fail --silent --show-error --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --output "$production_body" \
            "$PRODUCTION_URL"

          test -s "$production_body"
          grep -Fq "<title>Ahammed Nibras — Software engineer</title>" "$production_body"
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
