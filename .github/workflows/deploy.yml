name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.PRODUCTION_URL }}
  PUBLIC_ANALYTICS_ENABLED: ${{ vars.PUBLIC_ANALYTICS_ENABLED || 'false' }}

jobs:
  verify:
    name: Verify production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          node-version-file: .node-version
          cache: true
          install: false

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "12.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Lychee 0.24.2
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --version
          checkbox: false
          fail: true
          failIfEmpty: false
          jobSummary: false
          lycheeVersion: v0.24.2
          output: .cache/lychee/setup.md

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify production artifact
        run: pnpm run verify

      - name: Upload verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-reports-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            .lighthouseci/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload deployable site
        uses: actions/upload-artifact@v7.0.2
        with:
          name: portfolio-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  feedback:
    name: Deploy feedback preview
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: feedback
      url: ${{ steps.deploy.outputs.deployment_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          node-version-file: .node-version
          cache: true
          install: false

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "12.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: portfolio-dist-${{ github.sha }}
          path: dist/

      - name: Check verified artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_headers

      - name: Deploy feedback preview
        id: deploy
        shell: bash
        run: |
          output_file="$(mktemp "$RUNNER_TEMP/feedback-deploy.XXXXXX")"
          export WRANGLER_OUTPUT_FILE_PATH="$output_file"
          pnpm exec wrangler pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch feedback \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false

          deployment_url="$(
            jq -ers '
              map(select(.type == "pages-deploy" and .version == 1))
              | select(length == 1)
              | .[0].url
              | select(type == "string" and startswith("https://"))
            ' "$output_file"
          )"

          printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

      - name: Verify feedback preview
        shell: bash
        run: |
          preview_headers="$RUNNER_TEMP/preview.headers"
          preview_body="$RUNNER_TEMP/preview.html"

          curl --fail --silent --show-error --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --dump-header "$preview_headers" \
            --output "$preview_body" \
            "$DEPLOYMENT_URL"

          cmp "$preview_body" dist/index.html
          grep -Eiq \
            '^x-robots-tag:[[:space:]]*noindex([[:space:]]|$)' \
            "$preview_headers"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}

      - name: Summarize verified feedback preview
        shell: bash
        run: |
          printf '## Feedback preview\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Preview: [%s](%s)\n' "$DEPLOYMENT_URL" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Commit: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}

  deploy:
    name: Deploy production
    needs: feedback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          node-version-file: .node-version
          cache: true
          install: false

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "12.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: portfolio-dist-${{ github.sha }}
          path: dist/

      - name: Check verified artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_headers

      - name: Deploy verified artifact
        run: >-
          pnpm exec wrangler pages deploy dist
          --project-name "$CLOUDFLARE_PAGES_PROJECT"
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-dirty=false
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

      - name: Smoke test production
        run: bash scripts/verify-production.sh "$PRODUCTION_URL" dist/index.html
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
