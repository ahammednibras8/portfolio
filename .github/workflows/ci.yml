name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: ${{ vars.PRODUCTION_URL }}
  PUBLIC_ANALYTICS_ENABLED: ${{ vars.PUBLIC_ANALYTICS_ENABLED || 'false' }}

jobs:
  verify:
    name: Quality, build, and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify workflow dependency lockfile
        run: |
          gh extension install github/gh-actions-lock --pin v0.5.0
          gh actions-lock --verify --fail-on-warning
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          node-version-file: .node-version
          cache: true
          install: false

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "12.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Lychee 0.24.2
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --version
          checkbox: false
          fail: true
          failIfEmpty: false
          jobSummary: false
          lycheeVersion: v0.24.2
          output: .cache/lychee/setup.md

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run repository verification
        run: pnpm run verify

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-reports-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            .lighthouseci/reports/
          if-no-files-found: ignore
          retention-days: 7
