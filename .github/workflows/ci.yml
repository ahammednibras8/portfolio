name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: https://example.com

jobs:
  verify:
    name: Quality, build, and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .node-version
          cache: true
          install: false

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "12.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Run linters
        run: pnpm run lint

      - name: Check Astro and TypeScript
        run: pnpm run check

      - name: Build static site
        run: pnpm run build

      - name: Detect generated HTML
        id: html
        shell: bash
        run: |
          if find dist -type f -name '*.html' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [[ -d src/pages ]] && find src/pages -type f -print -quit | grep -q .; then
            echo "::error::Page sources exist but the build produced no HTML."
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Generated HTML checks remain dormant until the first page is implemented."
          fi

      - name: Validate generated HTML
        if: steps.html.outputs.present == 'true'
        run: pnpm run lint:html

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --root-dir '${{ github.workspace }}/dist'
            './**/*.md'
            './dist/**/*.html'
          fail: true
          failIfEmpty: true
          format: markdown
          jobSummary: true
          lycheeVersion: v0.24.2
          output: .cache/lychee/internal.md

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium and axe tests
        run: pnpm run test:browser:chromium
        env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "true"

      - name: Run Lighthouse
        if: steps.html.outputs.present == 'true'
        run: pnpm exec lhci autorun

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/reports/
          if-no-files-found: ignore
          retention-days: 7
