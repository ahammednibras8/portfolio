name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: ${{ vars.PRODUCTION_URL }}
  PUBLIC_ANALYTICS_ENABLED: ${{ vars.PUBLIC_ANALYTICS_ENABLED || 'false' }}

jobs:
  build:
    name: Build and verify static site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify workflow dependency lockfile
        run: |
          gh extension install github/gh-actions-lock --pin v0.5.0
          gh actions-lock --verify --fail-on-warning
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          node-version-file: .node-version
          cache: true
          install: false

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "12.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Lychee 0.24.2
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --version
          checkbox: false
          fail: true
          failIfEmpty: false
          jobSummary: false
          lycheeVersion: v0.24.2
          output: .cache/lychee/setup.md

      - name: Build and verify static site
        run: pnpm run verify:static

      - name: Upload site build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: portfolio-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  checks:
    name: ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [Chromium, Lighthouse]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          node-version-file: .node-version
          cache: true
          install: false

      - name: Verify toolchain version
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "12.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download site build
        uses: actions/download-artifact@v8.0.2
        with:
          name: portfolio-dist-${{ github.sha }}
          path: dist/

      - name: Install Chromium
        if: ${{ matrix.suite == 'Chromium' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium checks
        if: ${{ matrix.suite == 'Chromium' }}
        run: pnpm run test:chromium
        env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "true"

      - name: Run Lighthouse
        if: ${{ matrix.suite == 'Lighthouse' }}
        run: pnpm run test:lighthouse

      - name: Upload check reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-reports-${{ matrix.suite }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            .lighthouseci/reports/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Quality, build, and Chromium
    needs: [build, checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all checks to pass
        run: |
          test "$BUILD_RESULT" = success
          test  "$CHECKS_RESULT" = success
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}

  preview:
    name: Deploy PR preview
    needs: verify
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pr-preview
      url: ${{ steps.deploy.outputs.deployment_url }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          node-version-file: .node-version
          cache: true
          install: false

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "12.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: portfolio-dist-${{ github.sha }}
          path: dist/

      - name: Check verified artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_headers

      - name: Upload PR preview
        id: deploy
        shell: bash
        run: |
          output_file="$(mktemp "$RUNNER_TEMP/pr-preview-deploy.XXXXXX")"
          export WRANGLER_OUTPUT_FILE_PATH="$output_file"
          pnpm exec wrangler pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "pr-$PR_NUMBER" \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false

          deployment_url="$(
            jq -ers '
              map(select(.type == "pages-deploy" and .version == 1))
              | select(length == 1)
              | .[0].url
              | select(type == "string" and startswith("https://"))
            ' "$output_file"
          )"

          printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Verify PR preview
        shell: bash
        run: |
          preview_headers="$RUNNER_TEMP/preview.headers"
          preview_body="$RUNNER_TEMP/preview.html"

          curl --fail --silent --show-error --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --dump-header "$preview_headers" \
            --output "$preview_body" \
            "$DEPLOYMENT_URL"

          cmp "$preview_body" dist/index.html
          grep -Eiq \
            '^x-robots-tag:[[:space:]]*noindex([[:space:]]|$)' \
            "$preview_headers"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}

      - name: Summarize verified PR preview
        shell: bash
        run: |
          printf '## PR preview\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Preview: [%s](%s)\n' "$DEPLOYMENT_URL" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Commit: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}

  preview-comment:
    name: Post PR preview link
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Create or update the preview comment
        shell: bash
        run: |
          repository="repos/$GITHUB_REPOSITORY"
          current_head="$(gh api "$repository/pulls/$PR_NUMBER" --jq 'select(.state == "open") | .head.sha')"
          if [[ "$current_head" != "$PR_HEAD_SHA" ]]; then
            printf 'The pull request closed or moved to another revision. Skipping preview comment.\n'
            exit 0
          fi

          comments="$repository/issues/$PR_NUMBER/comments"
          comment_ids="$(gh api --paginate "$comments?per_page=100" --jq '
            .[] | select(.user.login == "github-actions[bot]")
            | select(.body | startswith("<!-- portfolio-pr-preview -->\n")) | .id
          ')"

          printf -v body '<!-- portfolio-pr-preview -->\n**Cloudflare Pages preview**\n\n[Open preview](%s)\n\nVerified build: `%s`\n' \
            "$DEPLOYMENT_URL" "$GITHUB_SHA"

          if [[ -n "$comment_ids" ]]; then
            comment_id="${comment_ids%%$'\n'*}"
            gh api --method PATCH "$repository/issues/comments/$comment_id" --raw-field "body=$body" >/dev/null
          else
            gh api --method POST "$comments" --raw-field "body=$body" >/dev/null
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOYMENT_URL: ${{ needs.preview.outputs.deployment_url }}
