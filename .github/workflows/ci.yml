name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: ${{ vars.PRODUCTION_URL }}
  PUBLIC_ANALYTICS_ENABLED: ${{ vars.PUBLIC_ANALYTICS_ENABLED || 'false' }}

jobs:
  build:
    name: Build and verify static site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify workflow dependency lockfile
        run: |
          gh extension install github/gh-actions-lock --pin v0.5.0
          gh actions-lock --verify --fail-on-warning
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          node-version-file: .node-version
          cache: true
          install: false

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "12.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Lychee 0.24.2
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --version
          checkbox: false
          fail: true
          failIfEmpty: false
          jobSummary: false
          lycheeVersion: v0.24.2
          output: .cache/lychee/setup.md

      - name: Build and verify static site
        run: pnpm run verify:static

      - name: Upload site build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: portfolio-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  checks:
    name: ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [Chromium, Lighthouse]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          node-version-file: .node-version
          cache: true
          install: false

      - name: Verify toolchain version
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "12.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download site build
        uses: actions/download-artifact@v8.0.2
        with:
          name: portfolio-dist-${{ github.sha }}
          path: dist/

      - name: Install Chromium
        if: ${{ matrix.suite == 'Chromium' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium checks
        if: ${{ matrix.suite == 'Chromium' }}
        run: pnpm run test:chromium
        env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "true"

      - name: Run Lighthouse
        if: ${{ matrix.suite == 'Lighthouse' }}
        run: pnpm run test:lighthouse

      - name: Upload check reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-reports-${{ matrix.suite }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            .lighthouseci/reports/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Quality, build, and Chromium
    needs: [build, checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all checks to pass
        run: |
          test "$BUILD_RESULT" = success
          test  "$CHECKS_RESULT" = success
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}

  preview:
    name: Deploy PR preview
    needs: verify
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pr-preview
      url: ${{ steps.deploy.outputs.deployment_url }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
      playwright_url: ${{ steps.reports.outputs.playwright_url }}
      lighthouse_url: ${{ steps.reports.outputs.lighthouse_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          node-version-file: .node-version
          cache: true
          install: false

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "12.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: portfolio-dist-${{ github.sha }}
          path: dist/

      - name: Check verified artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_headers

      - name: Upload PR preview
        id: deploy
        shell: bash
        run: |
          output_file="$(mktemp "$RUNNER_TEMP/pr-preview-deploy.XXXXXX")"
          export WRANGLER_OUTPUT_FILE_PATH="$output_file"
          pnpm exec wrangler pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "pr-$PR_NUMBER" \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false

          deployment_url="$(
            jq -ers '
              map(select(.type == "pages-deploy" and .version == 1))
              | select(length == 1)
              | .[0].url
              | select(type == "string" and startswith("https://"))
            ' "$output_file"
          )"

          printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Verify PR preview
        shell: bash
        run: |
          preview_headers="$RUNNER_TEMP/preview.headers"
          preview_body="$RUNNER_TEMP/preview.html"

          curl --fail --silent --show-error --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --dump-header "$preview_headers" \
            --output "$preview_body" \
            "$DEPLOYMENT_URL"

          cmp "$preview_body" dist/index.html
          grep -Eiq \
            '^x-robots-tag:[[:space:]]*noindex([[:space:]]|$)' \
            "$preview_headers"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}

      - name: Summarize verified PR preview
        shell: bash
        run: |
          {
            printf '## PR preview\n\n'
            printf -- '- Preview: [%s](%s)\n' "$DEPLOYMENT_URL" "$DEPLOYMENT_URL"
            printf -- "- Commit: \`%s\`\n" "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}

      - name: Download browser report artifacts
        id: report-artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: ci-reports-*-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/pr-audits

      - name: Publish and verify browser reports
        id: reports
        if: ${{ steps.report-artifacts.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          publish="$RUNNER_TEMP/publish-pr-audits"
          node scripts/prepare-pr-reports.mjs "$RUNNER_TEMP/pr-audits" "$publish"
          if [[ ! -d "$publish" ]]; then
            exit 0
          fi

          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/pr-report-deploy.ndjson"
          pnpm exec wrangler pages deploy "$publish" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "pr-$PR_NUMBER" \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false

          url="$(jq -ers --arg project "$CLOUDFLARE_PAGES_PROJECT" '
            map(select(.type == "pages-deploy-detailed" and .version == 1))
            | select(length == 1) | .[0]
            | select(.pages_project == $project and .environment == "preview")
            | .url | select(type == "string" and startswith("https://"))
          ' "$WRANGLER_OUTPUT_FILE_PATH")"

          for report in "$publish"/*/*.html; do
            route="${report#"$publish"/}"
            route="${route%index.html}"
            route="${route%.html}"
            curl --fail --silent --show-error --max-time 15 \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --dump-header "$RUNNER_TEMP/pr-report.headers" \
              --output "$RUNNER_TEMP/pr-report.html" "$url/$route"
            cmp "$RUNNER_TEMP/pr-report.html" "$report"
            grep -Eiq '^content-type:[[:space:]]*text/html' "$RUNNER_TEMP/pr-report.headers"
            grep -Eiq '^x-robots-tag:[[:space:]]*noindex([[:space:]]|$)' "$RUNNER_TEMP/pr-report.headers"
          done

          if [[ -f "$publish/playwright/index.html" ]]; then
            printf 'playwright_url=%s/playwright/\n' "$url" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f "$publish/lighthouse/index.html" ]]; then
            printf 'lighthouse_url=%s/lighthouse/\n' "$url" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: portfolio-ci-reports
          PR_NUMBER: ${{ github.event.pull_request.number }}

  preview-comment:
    name: Post PR preview link
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: read
      pull-requests: write

    steps:
      - name: Collect test results for the PR comment
        continue-on-error: true
        shell: bash
        run: |
          reports_dir="$(mktemp -d "$RUNNER_TEMP/pr-reports.XXXXXX")"
          chromium="ci-reports-Chromium-$GITHUB_SHA"
          lighthouse="ci-reports-Lighthouse-$GITHUB_SHA"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$chromium" --name "$lighthouse" --dir "$reports_dir"

          counts="$(jq -er '
            [.suites[] | recurse(.suites[]?) | .specs[]? as $spec
              | $spec.tests[] | select(any(.results[]; .status == "passed"))
              | ($spec.file | split("/")[0])] as $passed
            | "\($passed | map(select(. == "e2e")) | length) end-to-end, \($passed | map(select(. == "accessibility")) | length) accessibility"
          ' "$reports_dir/$chromium/test-results/playwright.json")"

          scores="$(jq -er '
            def pct: . * 100 | round;
            .[] | select(.isRepresentativeRun)
            | (.url | sub("^https?://[^/]+"; "") | sub("/index\\.html$"; "/")) as $page
            | .summary
            | "| \($page) | \(.performance | pct) | \(.accessibility | pct) | \(.["best-practices"] | pct) | \(.seo | pct) |"
          ' "$reports_dir/$lighthouse/.lighthouseci/reports/manifest.json")"

          jq -er '
            [.[] | select(.isRepresentativeRun) | .summary] as $pages
            | ["performance", "accessibility", "best-practices", "seo"]
            | map(. as $category | [$pages[][$category]] | min * 100 | round)
            | join(" / ")
          ' "$reports_dir/$lighthouse/.lighthouseci/reports/manifest.json" \
            > "$RUNNER_TEMP/discord-lighthouse.txt"

          {
            printf 'Chromium: %s passed\n\n' "$counts"
            printf '| Page | Performance | Accessibility | Best practices | SEO |\n'
            printf '| --- | ---: | ---: | ---: | ---: |\n'
            printf '%s\n' "$scores"
          } > "$RUNNER_TEMP/pr-test-summary.md"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create or update the preview comment
        id: comment
        shell: bash
        run: |
          repository="repos/$GITHUB_REPOSITORY"
          current_head="$(gh api "$repository/pulls/$PR_NUMBER" --jq 'select(.state == "open") | .head.sha')"
          if [[ "$current_head" != "$PR_HEAD_SHA" ]]; then
            printf 'The pull request closed or moved to another revision. Skipping preview comment.\n'
            exit 0
          fi

          comments="$repository/issues/$PR_NUMBER/comments"
          comment_ids="$(gh api --paginate "$comments?per_page=100" --jq '
            .[] | select(.user.login == "github-actions[bot]")
            | select(.body | startswith("<!-- portfolio-pr-preview -->\n")) | .id
          ')"

          printf -v body '<!-- portfolio-pr-preview -->\n**Cloudflare Pages preview**\n\n[Open preview](%s) · **CI passed**\n' \
            "$DEPLOYMENT_URL"

          report_links=""
          if [[ -n "$PLAYWRIGHT_URL" ]]; then
            report_links="[Playwright report]($PLAYWRIGHT_URL)"
          fi
          if [[ -n "$LIGHTHOUSE_URL" ]]; then
            report_links+="${report_links:+ · }[Lighthouse reports]($LIGHTHOUSE_URL)"
          fi
          if [[ -n "$report_links" ]]; then
            body+=$'\n'"$report_links"$'\n'
          else
            body+=$'\nBrowser reports are unavailable for this run.\n'
          fi

          if [[ -s "$RUNNER_TEMP/pr-test-summary.md" ]]; then
            body+=$'\n'"$(cat "$RUNNER_TEMP/pr-test-summary.md")"$'\n'
          else
            body+=$'\nTest counts and Lighthouse scores are unavailable for this run.\n'
          fi

          method=POST
          target="$comments"
          if [[ -n "$comment_ids" ]]; then
            method=PATCH
            target="$repository/issues/comments/${comment_ids%%$'\n'*}"
          fi

          comment_url="$(gh api --method "$method" "$target" \
            --raw-field "body=$body" --jq '.html_url')"
          printf 'url=%s\nreport_links=%s\n' "$comment_url" "$report_links" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOYMENT_URL: ${{ needs.preview.outputs.deployment_url }}
          PLAYWRIGHT_URL: ${{ needs.preview.outputs.playwright_url }}
          LIGHTHOUSE_URL: ${{ needs.preview.outputs.lighthouse_url }}

      - name: Notify Discord of the verified preview
        if: ${{ steps.comment.outputs.url != '' }}
        continue-on-error: true
        shell: bash
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            printf 'Discord webhook is not configured.\n'
            exit 0
          fi

          issue_number="$(jq -r '
            (.pull_request.body // "")
            | capture("(?im)^Related:[ \t]*#(?<number>[1-9][0-9]*)[ \t\r]*$").number
          ' "$GITHUB_EVENT_PATH")"
          related=""
          if [[ -n "$issue_number" ]]; then
            issue_title="$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number" \
              --jq '.title | sub("^\\[Feature\\]: "; "") | gsub("[\\[\\]()\\r\\n]"; " ")' 2>/dev/null || true)"
            printf -v related 'Related to [#%s%s](%s/%s/issues/%s)\n\n' \
              "$issue_number" "${issue_title:+ · $issue_title}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$issue_number"
          fi

          printf -v description '%s**Preview ready · CI passed**\n[Open preview](%s) · [View checks and reports](%s)' \
            "$related" "$DEPLOYMENT_URL" "$COMMENT_URL"
          if [[ -n "$REPORT_LINKS" ]]; then
            description+=$'\n'"$REPORT_LINKS"
          fi
          scores=""
          if [[ -s "$RUNNER_TEMP/discord-lighthouse.txt" ]]; then
            scores="$(<"$RUNNER_TEMP/discord-lighthouse.txt")"
          fi
          payload="$(jq -c --arg description "$description" --arg scores "$scores" '
            ($scores | split(" / ")) as $score
            | {
                allowed_mentions: {parse: []},
                embeds: [{
                  title: "PR #\(.pull_request.number) · \(.pull_request.title[:110])",
                  url: .pull_request.html_url,
                  description: $description,
                  fields: (if ($score | length) == 4 then [{
                    name: "Lighthouse · lowest scores across audited pages",
                    value: "Performance **\($score[0])** · Accessibility **\($score[1])**\nBest practices **\($score[2])** · SEO **\($score[3])**"
                  }] else [] end)
                }]
              }
          ' "$GITHUB_EVENT_PATH")"
          if ! status="$(curl --silent --max-time 10 --output /dev/null \
            --write-out '%{http_code}' --json "$payload" --url-query 'wait=true' \
            --url "$DISCORD_WEBHOOK_URL")" || [[ "$status" != 200 ]]; then
            printf '::warning::Discord preview notification failed.\n'
            exit 1
          fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ needs.preview.outputs.deployment_url }}
          COMMENT_URL: ${{ steps.comment.outputs.url }}
          REPORT_LINKS: ${{ steps.comment.outputs.report_links }}
