name: Bug report
description: Report a problem with the site or its tools.
title: "[Bug]: "

body:
  - type: markdown
    attributes:
      value: |
        Help us reproduce the problem. Remove passwords, private data, and confidential client information.

  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What went wrong, and who does it affect?
      placeholder: A short description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the shortest steps that show the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Content
        - Accessibility
        - Visual layout
        - Browser behavior
        - Build or quality tooling
        - Deployment
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the URL, browser version, operating system, or command.
      placeholder: Safari 20 on macOS, or pnpm run build
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Add useful logs, screenshots, URLs, or errors after removing secrets.
