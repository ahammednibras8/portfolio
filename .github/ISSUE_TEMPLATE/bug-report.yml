name: Bug report
description: Report reproducible incorrect behavior in the site or tooling.
title: "[Bug]: "

body:
  - type: markdown
    attributes:
      value: |
        Provide enough evidence to reproduce the problem. Remove credentials, private data, and confidential client information.

  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Describe what is wrong and who it affects.
      placeholder: A clear description of the incorrect behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the correct observable result.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Content
        - Accessibility
        - Visual layout
        - Browser behavior
        - Build or quality tooling
        - Deployment
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the URL, browser and version, operating system, or command involved.
      placeholder: Safari 20 on macOS, or pnpm run build
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Add relevant logs, screenshots, URLs, or error output after removing secrets.
