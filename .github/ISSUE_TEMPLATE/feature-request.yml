name: Feature request
description: Suggest an improvement for visitors or contributors.
title: "[Feature]: "

body:
  - type: markdown
    attributes:
      value: |
        Start with the problem and the result you want. Leave out technical changes that are not required.

  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who has the problem, what are they trying to do, and what gets in the way?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be better when this work is finished?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List clear checks that show the work is finished.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope boundaries
      description: What should this work leave out?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and references
      description: Add useful research, examples, screenshots, or related issues. Do not include private information.
